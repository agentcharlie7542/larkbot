name: Qoo10 Daily Sales Report

on:
  schedule:
    # 매일 오전 8:30 KST = UTC 23:30 (전날)
    - cron: '30 23 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 데일리 리포트 실행
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          QOO10_ID: ${{ secrets.QOO10_ID }}
          QOO10_PW: ${{ secrets.QOO10_PW }}
        run: python daily_sales_bot.py
